# Éden: análise de código do GitHub (CodeQL) para Python e para o app.
# Gratuita em repositório público. Os achados ficam em Security → Code scanning.
name: Éden — CodeQL

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analisar:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
