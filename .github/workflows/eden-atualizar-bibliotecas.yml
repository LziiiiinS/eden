# Éden: atualiza nos arquivos de versões (uv.lock e rust/Cargo.lock) só as
# bibliotecas pedidas — as que os verificadores de segurança apontaram —,
# porque o ambiente do Claude não acessa o PyPI nem o crates.io.
#
# Como usar: num branch "eden-deps-…", colocar os pacotes Python em
# .github/eden/atualizar-pacotes.txt e os pacotes Rust em
# .github/eden/atualizar-crates.txt (um por linha). Este fluxo atualiza os
# arquivos de versões e grava no mesmo branch. Depois o PR desse branch passa
# pelos testes normais antes de ir para o main.
name: Éden — atualizar bibliotecas

on:
  push:
    branches: ["eden-deps-*"]
    paths:
      - ".github/eden/atualizar-pacotes.txt"
      - ".github/eden/atualizar-crates.txt"

permissions:
  contents: write

jobs:
  atualizar:
    name: Atualizar arquivos de versões
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
      - uses: dtolnay/rust-toolchain@stable
      - name: Python (uv.lock)
        run: |
          args=""
          for p in $(grep -Ev '^\s*(#|$)' .github/eden/atualizar-pacotes.txt 2>/dev/null); do
            args="$args --upgrade-package $p"
          done
          if [ -z "$args" ]; then echo "Nenhum pacote Python pedido."; exit 0; fi
          echo "uv lock$args"
          bash .github/eden/anotar.sh "uv lock" uv lock $args
      - name: Rust (rust/Cargo.lock)
        working-directory: rust
        run: |
          args=""
          for p in $(grep -Ev '^\s*(#|$)' ../.github/eden/atualizar-crates.txt 2>/dev/null); do
            args="$args -p $p"
          done
          if [ -z "$args" ]; then echo "Nenhum pacote Rust pedido."; exit 0; fi
          echo "cargo update$args"
          bash ../.github/eden/anotar.sh "cargo update" cargo update $args
      - name: Gravar no branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock rust/Cargo.lock
          if git diff --cached --quiet; then
            echo "::notice title=Versões::nada mudou"
            exit 0
          fi
          git diff --cached --stat
          git commit -m "Éden: atualiza bibliotecas com falhas conhecidas (arquivos de versões)"
          git push
