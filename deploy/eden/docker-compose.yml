# Éden: um serviço só, sem modelos locais. Serve para o notebook e, depois,
# para o servidor.
#
# A imagem é montada direto do GitHub (branch main), então este computador não
# precisa ter o código: basta esta pasta com o docker-compose.yml, o .env e os
# scripts. Cada "iniciar" busca a versão mais nova do main.
#
# Chaves: ficam no arquivo .env desta pasta (nunca no GitHub).
# Dados (conversas, gastos, perfil): ficam no volume "eden-dados" do Docker.
name: eden

services:
  eden:
    build:
      context: https://github.com/LziiiiinS/eden.git#main
      dockerfile: deploy/docker/Dockerfile
    image: eden:local
    entrypoint: ["sh", "/app/deploy/eden/iniciar-no-conteiner.sh"]
    env_file: .env
    environment:
      OPENJARVIS_HOME: /dados
    ports:
      # Só este computador abre o Éden (http://localhost:8000). Para o
      # celular, o acesso entra depois pela rede privada (Tailscale), com HTTPS.
      - "127.0.0.1:8000:8000"
    volumes:
      - eden-dados:/dados
    restart: unless-stopped
    # Limites do contêiner: memória e número de processos; sem permissões
    # especiais do Linux e sem ganhar privilégio depois de ligar.
    mem_limit: 2g
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Programa só-leitura: dá para gravar só nos dados (/dados) e numa pasta
    # temporária na memória (/tmp). Mesmo que algo dê errado, ninguém muda o
    # código do Éden dentro do contêiner.
    read_only: true
    tmpfs:
      - /tmp:size=128m

  # Backup e restauração. Não liga junto com o Éden: só roda quando o
  # backup-eden / restaurar-eden chamam ("docker compose run --rm backup ...").
  # Usa a mesma imagem, vê só os dados (/dados) e a pasta "backups" desta
  # pasta (/backups), e fica sem rede e sem as chaves do .env.
  backup:
    image: eden:local
    pull_policy: never
    profiles: ["ferramentas"]
    entrypoint: ["python", "-m", "openjarvis.eden.backup"]
    environment:
      OPENJARVIS_HOME: /dados
    volumes:
      - eden-dados:/dados
      - ./backups:/backups
    network_mode: none
    mem_limit: 1g
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:size=128m

volumes:
  eden-dados:
